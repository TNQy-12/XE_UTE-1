<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parking Firebase Realtime</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fc;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    max-width:1200px;
    margin:auto;
}

.slot{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.slot:hover{
    transform:translateY(-5px);
}

.slot img{
    width:100%;
    height:180px;
    object-fit:contain;
}

.slot h2{
    margin:15px 0;
    color:#222;
}

.status{
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.empty{
    background:#28a745;
}

.full{
    background:#dc3545;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

button{
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    color:white;
}

.in-btn{
    background:#007bff;
}

.out-btn{
    background:#ff5722;
}

@media(max-width:768px){

    .container{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<h1>🚗 Parking Firebase Realtime</h1>

<div class="container" id="parkingContainer"></div>

<script type="module">

// ==========================
// IMPORT FIREBASE
// ==========================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ==========================
// FIREBASE CONFIG
// ==========================

const firebaseConfig = {

    apiKey: "AIzaSyBTWpFWI6qf975JB2RV8Q1Vs-YTta5PlYY",

    authDomain: "ps-01-583ef.firebaseapp.com",

    databaseURL:
    "https://ps-01-583ef-default-rtdb.firebaseio.com",

    projectId: "ps-01-583ef",

    storageBucket:
    "ps-01-583ef.firebasestorage.app",

    messagingSenderId: "807899927486",

    appId:
    "1:807899927486:web:c729d1ab88c916fbaddfef",

    measurementId: "G-K3FFQTTCQY"
};

// ==========================
// INIT FIREBASE
// ==========================

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

// ==========================
// CREATE 9 SLOT UI
// ==========================

const container =
document.getElementById("parkingContainer");

for(let i = 1; i <= 9; i++){

    container.innerHTML += `

        <div class="slot">

            <img
                id="img${i}"
                src="https://cdn-icons-png.flaticon.com/512/744/744465.png"
            >

            <h2>Location ${i}</h2>

            <div
                class="status empty"
                id="status${i}"
            >
                Không có xe
            </div>

            <div class="buttons">

                <button
                    class="in-btn"
                    onclick="parkCar(${i})"
                >
                    Gửi vào
                </button>

                <button
                    class="out-btn"
                    onclick="removeCar(${i})"
                >
                    Lấy ra
                </button>

            </div>

        </div>

    `;
}

// ==========================
// READ FIREBASE REALTIME
// PATH: Status_Location
// ==========================

const statusRef = ref(db, "Status_Location");

onValue(statusRef, (snapshot) => {

    const data = snapshot.val();

    console.log(data);

    if(data){

        for(let i = 1; i <= 9; i++){

            const value = data["L" + i];

            const statusDiv =
            document.getElementById(`status${i}`);

            const img =
            document.getElementById(`img${i}`);

            // ======================
            // CÓ XE
            // ======================

            if(value == 1){

                statusDiv.innerHTML = "Có xe";

                statusDiv.className =
                "status full";

                img.src =
                "https://cdn-icons-png.flaticon.com/512/3202/3202926.png";

            }

            // ======================
            // KHÔNG CÓ XE
            // ======================

            else{

                statusDiv.innerHTML =
                "Không có xe";

                statusDiv.className =
                "status empty";

                img.src =
                "https://cdn-icons-png.flaticon.com/512/744/744465.png";

            }

        }

    }

});

// ==========================
// BUTTON GỬI XE
// ==========================

window.parkCar = function(id){

    set(ref(db, "Status_Location/L" + id), 1);

}

// ==========================
// BUTTON LẤY XE
// ==========================

window.removeCar = function(id){

    set(ref(db, "Status_Location/L" + id), 0);

}

</script>

</body>
</html>
